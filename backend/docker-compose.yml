services:
  postgres:
    image: postgres:16
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: praveen123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  orbit-backend:
    build:
      context: ./services/orbit-backend
    container_name: orbit-backend
    restart: unless-stopped
    env_file:
      - ./services/orbit-backend/.env
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://postgres:praveen123@postgres:5432/orbit_db?schema=public
      CONNECT_ADMIN_BASE_URL: http://connect-admin:4000
    depends_on:
      - postgres
      - connect-admin
    ports:
      - "4001:4001"

  connect-admin:
    build:
      context: ./services/connect-admin
    container_name: connect-admin
    restart: unless-stopped
    env_file:
      - ./services/connect-admin/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:praveen123@postgres:5432/ccms?schema=public
      ORBIT_BACKEND_BASE_URL: http://orbit-backend:4001
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  orbit-frontend:
    build:
      context: ../frontend/orbIOT
    container_name: orbit-frontend
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  postgres_data:
