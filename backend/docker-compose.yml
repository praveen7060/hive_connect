services:

  postgres:
    image: postgres:16

    container_name: orbit-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: praveen123
      POSTGRES_DB: orbitdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  orbit-backend:
    build:
      context: ./services/orbit-backend

    container_name: orbit-backend

    restart: unless-stopped

    env_file:
      - ./services/orbit-backend/.env

    depends_on:
      - postgres

    ports:
      - "4000:4000"

  connect-admin:
    image: node:20

    container_name: connect-admin

    working_dir: /app

    restart: unless-stopped

    volumes:
      - ./services/connect-admin:/app

    command: sh -c "npm install && npm run dev"

    ports:
      - "5000:5000"

  orbit-frontend:
    build:
      context: ../frontend/orbIOT

    container_name: orbit-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

volumes:
  postgres_data: